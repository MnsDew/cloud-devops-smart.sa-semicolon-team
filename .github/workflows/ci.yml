
name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Continuous Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tasks_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tasks_db_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3000
      HOST: 127.0.0.1
      LOG_LEVEL: silent
      CORS_ORIGIN: http://localhost:3000
      BODY_LIMIT: 100kb
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tasks_db_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Continuous Deployment to OCI
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    environment: production

    steps:
      - name: Prepare SSH
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key

          ssh-keyscan -H "$OCI_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          set -euo pipefail

          ssh -v \
            -i ~/.ssh/oci_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$OCI_USER@$OCI_HOST" \
            'echo "SSH connection successful"; whoami; hostname'

      - name: Deploy to OCI
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/oci_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$OCI_USER@$OCI_HOST" \
            'set -e
             cd ~/apps/cloud-devops-smart.sa-semicolon-team

             echo "Checking repository..."
             git status --short

             echo "Pulling latest master..."
             git pull --ff-only origin master

             echo "Rebuilding and restarting API..."
             sudo docker compose up -d --build api

             echo "Checking API health..."
             curl --fail --silent --show-error http://127.0.0.1:3000/health

             echo
             echo "Deployment completed successfully."

             echo "Container status:"
             sudo docker compose ps'

      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/oci_key
