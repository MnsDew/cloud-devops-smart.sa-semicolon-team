
name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Continuous Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tasks_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tasks_db_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3000
      HOST: 127.0.0.1
      LOG_LEVEL: silent
      CORS_ORIGIN: http://localhost:3000
      BODY_LIMIT: 100kb
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tasks_db_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Continuous Deployment to OCI
    runs-on: [self-hosted, Linux, ARM64]
    needs: build-and-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    environment: production
    timeout-minutes: 15

    steps:
      - name: Verify OCI runner and Docker access
        run: |
          set -euo pipefail

          echo "Runner host: $(hostname)"
          echo "Runner user: $(whoami)"

          test -d "$HOME/apps/cloud-devops-smart.sa-semicolon-team/.git"

          sudo -n docker version
          sudo -n docker compose version

      - name: Deploy latest master
        run: |
          set -euo pipefail

          cd "$HOME/apps/cloud-devops-smart.sa-semicolon-team"

          echo "Checking repository state..."
          git status --short

          echo "Pulling latest master..."
          git pull --ff-only origin master

          echo "Rebuilding and restarting API..."
          sudo -n docker compose up -d --build api

          echo "Checking API health..."
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3000/health; then
              echo
              echo "API health check passed."
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "API health check failed after 60 seconds."
              sudo -n docker compose logs --tail=100 api
              exit 1
            fi

            sleep 2
          done

          echo "Container status:"
          sudo -n docker compose ps
